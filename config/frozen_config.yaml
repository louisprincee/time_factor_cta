research_end: 2021-12-31
holdout_start: 2022-01-01
study_start: 2016-01-01
universe_file: universe/universe_by_year.json
sign_rule: 方向来自论文先验与上一轮小时频方向性结果，在因子上乘符号，使值越大越看多。不允许按本研究的 IC 翻转。
center_rule: 先对年化收益和收益风险比各自 z-score（ddof=0），再取欧氏距离最小的参数。原文未做 z-score，这一步是必要修正。
signal_rule: "factor_t 与 [t-W, t-1] 的分位数比较，不含当日。次日开盘成交。"
return_rule: "day_ret[t]=(openw[t+1]-openw[t])/open[t]"
standardize:
  method: rolling_mad
  window: 1000
  divisor: "5 * MAD"
  clip: 1.0
fee_base: 0.00025
fee_grid:
  - 0.00025
  - 0.0005
  - 0.001
slippage_rule: "每次换手按 n_ticks × tick / 当年价位中位数 收取单边比例滑点。tick 与价位都逐 (品种, 年) 由 research/costs.py 从分钟 close 估出，不查交易所表：取非零绝对一阶差分中出现得足够频繁的最小档（众数会偏大一倍）。写成 tick 数而非固定比例，是为了保留品种间实测 13.7 倍的成本差异。"
slippage_ticks: 1.0
slippage_tick_grid:
  - 0.0
  - 1.0
  - 2.0
